name: Desktop
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: make desktop-install desktop-check
      - run: npx playwright install --with-deps chromium
        working-directory: desktop/frontend
      - run: make desktop-e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-visual-checks
          path: dist/desktop-preview/
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm ci && npm run build
        working-directory: desktop/frontend
      - name: Build native executable
        shell: bash
        run: |
          tags=gui,desktop,production
          suffix=
          if [ "$RUNNER_OS" = Linux ]; then tags="$tags,webkit2_41"; fi
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          go build -trimpath -tags "$tags" -o "dist/pr-tracker-desktop$suffix" ./desktop
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: dist/pr-tracker-desktop*
