name: Desktop

on:
  workflow_call:
    inputs:
      version:
        description: Versão usada no nome dos pacotes
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Versão usada no nome dos pacotes (opcional)
        required: false
        type: string

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend desktop
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Versão dos pacotes
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="${VERSION_INPUT:-ci-${GITHUB_SHA::7}}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: make desktop-install desktop-check
      - run: npm run build
        working-directory: desktop/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: desktop/frontend
      - run: make desktop-e2e
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-frontend-assets
          path: desktop/frontend/dist/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-visual-checks
          path: dist/desktop-preview/
          retention-days: 7

  native:
    name: Desktop (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: desktop-frontend-assets
          path: desktop/frontend/dist
      - name: Bibliotecas Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Compilar executável nativo
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          tags=gui,desktop,production
          suffix=
          if [ "$RUNNER_OS" = Linux ]; then tags="$tags,webkit2_41"; fi
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          go build -trimpath -tags "$tags" -o "dist/pr-tracker-desktop$suffix" ./desktop
      - name: Empacotar executável Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.frontend.outputs.version }}
        run: |
          name="pr-tracker-desktop_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir "dist/$name"
          cp dist/pr-tracker-desktop README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - name: Empacotar executável Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.frontend.outputs.version }}
        run: |
          $name = "pr-tracker-desktop_${env:VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          $package = "dist/$name"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item dist/pr-tracker-desktop.exe, README.md -Destination $package
          Compress-Archive -Path $package -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse $package
      - uses: actions/upload-artifact@v7
        with:
          name: pr-tracker-desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/pr-tracker-desktop_*.${{ matrix.goos == 'windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error
          retention-days: 7
