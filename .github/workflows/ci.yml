# Lint, tests and dependency vulnerability scan. Pushes to main and version
# tags run this through nightly.yml / release.yml (workflow_call), so the
# published artifacts are always gated by it. Native packages are built only
# for those, or on demand: a pull request is checked, not packaged.
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Versão usada nos pacotes
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The window links these on Linux, also for headless test runs.
  LINUX_PACKAGES: libxkbcommon-dev libwayland-dev

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Cargo.lock está em dia
        run: cargo metadata --locked --format-version 1 > /dev/null
      - run: make lint

  test:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Bibliotecas Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  package:
    name: Pacote (${{ matrix.os }}/${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    needs: [lint, test, vuln]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: windows-latest
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Bibliotecas Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Empacotar
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="${VERSION_INPUT:-ci-${GITHUB_SHA::7}}"
          make package VERSION="$version" OS="${{ matrix.os }}" ARCH="${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: pr-tracker-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/pr-tracker_*.${{ matrix.os == 'windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error
          retention-days: 7

  vuln:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: make vuln
