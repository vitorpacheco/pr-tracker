# New advisories are published without any change to this repo, so the
# dependency scan also runs on a schedule against main.
name: Vulnerabilidades

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup show
      - run: make vuln
