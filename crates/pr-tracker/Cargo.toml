[package]
name = "pr-tracker"
description = "Track pull requests, merge requests and issues across GitHub, GitLab and Gitea"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
chrono.workspace = true
pr-tracker-core = { path = "../core" }
rune = { git = "https://github.com/anomalyco/rune", rev = "b73010b85b451ad687a7189d347dd8875fb91e24", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "b73010b85b451ad687a7189d347dd8875fb91e24", features = ["markdown"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
